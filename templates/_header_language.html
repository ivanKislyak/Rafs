{% load i18n %}
<form class="header-language-form"
      action="{% url 'set_language' %}"
      method="post">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    {% get_current_language as LANGUAGE_CODE %}
    <span class="header-language-control">
        <svg class="header-language-icon"
             viewBox="0 0 24 24"
             aria-hidden="true"
             focusable="false">
            <circle cx="12" cy="12" r="8.5"></circle>
            <path d="M3.8 12h16.4M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5S14.3 18.1 12 20.5M12 3.5C9.7 5.9 8.6 8.7 8.6 12s1.1 6.1 3.4 8.5">
            </path>
        </svg>
        <select class="header-language-select"
                name="language"
                aria-label="{% translate 'Language' %}"
                onchange="this.form.submit()">
            {% get_available_languages as LANGUAGES %}
            {% get_language_info_list for LANGUAGES as languages %}
            {% for language in languages %}
                <option value="{{ language.code }}"
                        {% if language.code == LANGUAGE_CODE %} selected{% endif %}>
                    {{ language.name_local|capfirst }}
                </option>
            {% endfor %}
        </select>
        <span class="header-language-chevron" aria-hidden="true"></span>
    </span>
</form>
