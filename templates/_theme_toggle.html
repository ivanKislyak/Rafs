{% load i18n %}
<button class="header-theme-toggle" type="button" data-theme-toggle
        data-light-label="{% translate 'Light theme' %}"
        data-dark-label="{% translate 'Dark theme' %}">
    <svg class="header-profile-action-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.5"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
    </svg>
    <svg class="header-profile-action-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"></path>
    </svg>
    <span data-theme-toggle-label>{% translate "Light theme" %}</span>
</button>
