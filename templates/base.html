{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="ru">
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
              crossorigin="anonymous">
        <meta charset="UTF-8" />
        {% block social_meta %}
            <meta name="description"
                  content="RAFS — оценки, подробные рейтинги и отзывы на фильмы">
            <meta property="og:site_name" content="RAFS">
            <meta property="og:type" content="website">
            <meta property="og:title" content="RAFS">
            <meta property="og:description"
                  content="Оценивайте фильмы по разным критериям и делитесь отзывами">
            <meta property="og:image"
                  content="https://{{ request.get_host }}{% static 'images/rafs-preview.png' %}">
        {% endblock %}
        <meta name="viewport"
              content="width=device-width, user-scalable=yes, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <link rel="icon"
              type="image/x-icon"
              href="{% static 'images/favicon.ico' %}">
        <title>{% block title %} RAFS {% endblock %}</title>
        <link rel="stylesheet" href="{% static 'css/base.css' %}" />
        <link rel="stylesheet" href="{% static 'movies/css/movies.css' %}?v=20260808-1" />
        <link rel="stylesheet" href="{% static 'core/css/core.css' %}" />
    </head>
    <body>
        {% include "_header.html" %}
        <div class="main-container">
            {% block content %}{% endblock %}
        </div>
    </body>
</html>
