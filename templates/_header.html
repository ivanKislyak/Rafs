{% load static %}
<header class="main-header">
    <nav class="main-nav">
        <a class="logo" href="{% url 'core:home' %}">
            <img class="red-logo-img"
                 src="{% static 'images/red_gl_rafs_logo.png' %}"
                 alt=""
                 aria-hidden="true" />
            <img class="blue-logo-img"
                 src="{% static 'images/blue_gl_rafs_logo.png' %}"
                 alt=""
                 aria-hidden="true" />
            <img class="logo-img"
                 src="{% static 'images/def_rafs_logo.png' %}"
                 alt="RAFS" />
        </a>
        <a class="catalog-category" href="{% url 'movies:catalog' %}">Каталог</a>
        <a class="about-site" href="{% url 'core:about' %}">О сайте</a>
    </nav>
    <nav class="header-account" aria-label="Аккаунт">
        {% if user.is_authenticated %}
            <div class="header-user">
                {% if user.avatar_image %}
                    <img class="header-user-avatar"
                         src="{{ user.avatar_image.url }}"
                         alt="Аватар пользователя {{ user.username }}">
                {% else %}
                    <img class="header-user-avatar"
                         src="{% static 'images/default_profile_img.png' %}"
                         alt="Аватар пользователя {{ user.username }}">
                {% endif %}
                <span class="header-username" title="{{ user.username }}">{{ user.username }}</span>
            </div>
            <form class="header-logout-form" action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="header-logout-button" type="submit">Выйти</button>
            </form>
        {% else %}
            <a class="header-auth-link header-login-link" href="{% url 'login' %}">Войти</a>
            <a class="header-auth-link header-register-link"
               href="{% url 'accounts:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>
