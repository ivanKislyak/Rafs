{% load static %}
<link rel="preload"
      as="image"
      href="{% static 'images/like_enabled.png' %}">
<link rel="preload"
      as="image"
      href="{% static 'images/like_disabled.png' %}">
<link rel="preload"
      as="image"
      href="{% static 'images/dislike_enabled.png' %}">
<link rel="preload"
      as="image"
      href="{% static 'images/dislike_disabled.png' %}">
{% if site_event == "halloween-2026" %}
{% comment %}Preload the seasonal palette only while the event is on; otherwise it is never shown.{% endcomment %}
<link rel="preload"
      as="image"
      href="{% static 'images/halloween/halloween_like_disabled.png' %}">
<link rel="preload"
      as="image"
      href="{% static 'images/halloween/halloween_like_enabled.png' %}">
<link rel="preload"
      as="image"
      href="{% static 'images/halloween/halloween_dislike_disabled.png' %}">
<link rel="preload"
      as="image"
      href="{% static 'images/halloween/halloween_dislike_enabled.png' %}">
{% endif %}
